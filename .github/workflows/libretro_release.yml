name: libretro_release

# Builds the mupen64plus_next_libretro core on tag push and publishes a PUBLIC
# GitHub Release with a UNIVERSAL (arm64 + x86_64) macOS dylib — one zip under
# the historical asset name, per RetroNest's standing universal-cores policy.
#
# Slices (both built on one macos-14 Apple Silicon runner, sequentially, with
# a full *.o clean between — the Makefile builds objects in-tree and the
# linker silently drops wrong-arch leftovers):
#   * arm64  — WITH_DYNAREC=aarch64: the new_dynarec aarch64 recompiler with
#     this fork's Darwin support (Mach-O port of linkage_arm64.S, MAP_JIT W^X
#     with per-thread write protection, x18 excluded from register allocation,
#     per-target far-jump veneer scratch).
#   * x86_64 — WITH_DYNAREC=x86_64 under Rosetta: the x64 recompiler.
#     ASFLAGS="-f macho64 -DLEADING_UNDERSCORE" is load-bearing: the x64
#     asm's cglobal/cextern macros only prepend the mach-o leading underscore
#     when LEADING_UNDERSCORE is defined; without it every recompiler symbol
#     links under the wrong name ("Undefined symbols for architecture x86_64").
#
# Both slices rely on the Makefile defining NO_ASM only when WITH_DYNAREC is
# empty: an unconditional NO_ASM compiles out the EMUMODE_DYNAREC branch of
# generic_jump_to() and the guest wedges (EXL stuck) at the first exception.
#
# The dylib links only system frameworks (OpenGL/AudioToolbox/libc++), so
# there is no dep-bundling or lib-set parity step — a plain pairwise lipo of
# the two dylibs is the whole merge.
#
# The libretro entry-point asset RetroNest matches is any `*.dylib.zip`
# (base LibretroAdapter rule), so the zip is mupen64plus_next_libretro.dylib.zip.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # required for softprops/action-gh-release

jobs:
  build:
    name: Build macOS universal (arm64 + x86_64 recompilers)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No submodules — this repo VENDORS all its deps (GLideN64,
        # mupen64plus-core, the RSP plugins) as committed source. The only
        # git submodule is one orphaned gitlink deep inside paraLLEl
        # (mupen64plus-rsp-paraLLEl/lightning/gnulib) with no .gitmodules
        # mapping; a default (non-recursive) checkout leaves it as an empty
        # placeholder, which is fine — paraLLEl is Vulkan-only and disabled
        # below (HAVE_PARALLEL_RSP/RDP=0).

      - name: Build arm64 slice (aarch64 recompiler)
        run: |
          NCPU=$(sysctl -n hw.ncpu)
          echo "Building arm64 with -j$NCPU"
          make platform=osx \
               WITH_DYNAREC=aarch64 \
               HAVE_PARALLEL_RSP=0 \
               HAVE_PARALLEL_RDP=0 \
               -j"$NCPU"
          lipo -info mupen64plus_next_libretro.dylib
          lipo -info mupen64plus_next_libretro.dylib | grep -q 'arm64'
          mkdir -p stage
          mv mupen64plus_next_libretro.dylib stage/mupen64plus_next_libretro-arm64.dylib

      - name: Clean objects between arch builds
        run: find . -name '*.o' -delete

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Install x86_64 Homebrew at /usr/local
        run: |
          if [ ! -x /usr/local/bin/brew ]; then
            echo "Installing x86_64 Homebrew at /usr/local..."
            NONINTERACTIVE=1 arch -x86_64 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          arch -x86_64 /usr/local/bin/brew --version

      - name: Install build deps (x86_64)
        run: |
          # nasm assembles x64/linkage_x64.asm (the x64 recompiler).
          arch -x86_64 /usr/local/bin/brew update
          arch -x86_64 /usr/local/bin/brew install nasm

      - name: Build x86_64 slice (arch -x86_64, x64 recompiler)
        run: |
          NCPU=$(sysctl -n hw.ncpu)
          echo "Building x86_64 with -j$NCPU (nasm $(arch -x86_64 /usr/local/bin/nasm -v))"
          arch -x86_64 env \
            PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin \
            make platform=osx \
                 WITH_DYNAREC=x86_64 \
                 ASFLAGS="-f macho64 -DLEADING_UNDERSCORE" \
                 NASM=/usr/local/bin/nasm \
                 HAVE_PARALLEL_RSP=0 \
                 HAVE_PARALLEL_RDP=0 \
                 -j"$NCPU"
          lipo -info mupen64plus_next_libretro.dylib
          lipo -info mupen64plus_next_libretro.dylib | grep -q 'x86_64'
          mv mupen64plus_next_libretro.dylib stage/mupen64plus_next_libretro-x86_64.dylib

      - name: Lipo universal + verify
        run: |
          set -euo pipefail
          lipo -create \
            stage/mupen64plus_next_libretro-arm64.dylib \
            stage/mupen64plus_next_libretro-x86_64.dylib \
            -output stage/mupen64plus_next_libretro.dylib
          codesign --force --sign - stage/mupen64plus_next_libretro.dylib
          file stage/mupen64plus_next_libretro.dylib
          lipo -info stage/mupen64plus_next_libretro.dylib
          lipo -info stage/mupen64plus_next_libretro.dylib | grep -q 'arm64'
          lipo -info stage/mupen64plus_next_libretro.dylib | grep -q 'x86_64'
          # Per-slice libretro entry points.
          for A in arm64 x86_64; do
            N=$(nm -arch "$A" -gU stage/mupen64plus_next_libretro.dylib 2>/dev/null | grep -c '_retro_' || true)
            echo "$A: $N exported _retro_* symbols"
            test "$N" -ge 20
          done
          # Universal-policy gate: no Homebrew/local dylib references.
          if otool -L stage/mupen64plus_next_libretro.dylib | grep -E '/usr/local/|/opt/homebrew/'; then
            echo "ERROR: dylib references Homebrew paths"; exit 1
          fi
          rm stage/mupen64plus_next_libretro-arm64.dylib \
             stage/mupen64plus_next_libretro-x86_64.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: mupen64plus_next_libretro-dylib
          path: stage/mupen64plus_next_libretro.dylib
          if-no-files-found: error

  release:
    name: Package and publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dylib artifact
        uses: actions/download-artifact@v4
        with:
          name: mupen64plus_next_libretro-dylib
          path: stage/

      - name: Create zip
        run: |
          cd stage
          zip ../mupen64plus_next_libretro.dylib.zip mupen64plus_next_libretro.dylib
          cd ..
          unzip -l mupen64plus_next_libretro.dylib.zip

      - name: Compose release body
        run: |
          {
            echo "**Platform:** macOS UNIVERSAL (arm64 + x86_64) — native aarch64 recompiler on Apple Silicon, x64 recompiler under Rosetta/Intel."
            echo "**Fork patches:** Darwin arm64 dynarec support (Mach-O linkage port, MAP_JIT W^X, x18 exclusion, NO_ASM dispatch fix) + GLideN64 present fixes for core-profile GL frontends."
          } > release_body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_body.md
          generate_release_notes: true
          files: mupen64plus_next_libretro.dylib.zip
          fail_on_unmatched_files: true
